name: starvy
description: "A new Flutter project."

publish_to: "none"

version: 1.1.6+12

environment:
  sdk: ^3.10.7

dependencies:
  barcode_widget: ^2.0.4
  cupertino_icons: ^1.0.8
  dio: ^5.9.1
  excel: ^4.0.6
  file_picker: ^10.3.10
  file_saver: ^0.3.1
  firebase_analytics: ^12.1.2
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  firebase_database: ^12.1.4
  flutter:
    sdk: flutter
  google_mobile_ads: ^7.0.0
  image_picker: ^1.2.1
  in_app_purchase: ^3.2.3
  mobile_scanner: ^7.1.4
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  photo_view: ^0.15.0
  provider: ^6.1.5+1
  reorderable_grid_view: ^2.2.8
  screenshot: ^3.0.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/starvy.png"
  adaptive_icon_foreground: "assets/images/starvy.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/file/
